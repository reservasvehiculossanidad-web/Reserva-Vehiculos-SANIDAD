<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCOO Sanidad - Gestión de Vehículos</title>
    <style>
        /* CSS Puro Integrado: Garantiza el diseño sin dependencias externas */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f3f4f6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 16px;
        }
        .container {
            width: 100%;
            max-width: 440px;
            background-color: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            min-height: 90vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .content {
            padding: 24px;
        }
        .header {
            text-align: center;
            margin-bottom: 24px;
            border-bottom: 1px solid #e5e7eb;
            padding-bottom: 16px;
        }
        .header h1 {
            color: #dc2626;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .header p {
            color: #6b7280;
            font-size: 12px;
            margin-top: 4px;
            font-weight: 500;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 4px;
        }
        input, select {
            width: 100%;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            padding: 10px;
            font-size: 14px;
            color: #1f2937;
            background-color: #f9fafb;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input:focus, select:focus {
            border-color: #dc2626;
            box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.15);
        }
        input::placeholder {
            color: #9ca3af;
        }
        .btn-submit {
            width: 100%;
            background-color: #dc2626;
            color: #ffffff;
            font-weight: 700;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            letter-spacing: 0.5px;
            margin-top: 8px;
            transition: background-color 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .btn-submit:hover {
            background-color: #b91c1c;
        }
        .btn-submit:disabled {
            background-color: #fca5a5;
            cursor: not-allowed;
        }
        .agenda-title {
            font-size: 18px;
            font-weight: 700;
            color: #1f2937;
            margin-top: 32px;
            margin-bottom: 12px;
            border-bottom: 1px solid #e5e7eb;
            padding-bottom: 4px;
        }
        .reservas-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .reserva-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #e5e7eb;
            border-left: 4px solid #dc2626;
            border-radius: 0 8px 8px 0;
            padding: 12px;
            background-color: #ffffff;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }
        .reserva-info {
            flex: 1;
            min-width: 0;
        }
        .reserva-info h4 {
            font-weight: 700;
            color: #1f2937;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .reserva-info p {
            font-size: 12px;
            color: #6b7280;
            margin-top: 2px;
        }
        .reserva-info .meta-date {
            font-size: 11px;
            color: #9ca3af;
            margin-top: 2px;
        }
        .no-data {
            font-size: 14px;
            color: #9ca3af;
            font-style: italic;
            text-align: center;
            padding: 16px 0;
        }
        .footer {
            border-top: 1px solid #e5e7eb;
            background-color: #f9fafb;
            padding: 12px;
            display: flex;
            justify-content: space-around;
            color: #9ca3af;
        }
        .footer-dot { width: 14px; height: 14px; border: 2px solid #9ca3af; border-radius: 50%; opacity: 0.5; }
        .footer-square { width: 14px; height: 14px; border: 2px solid #9ca3af; border-radius: 3px; opacity: 0.5; }
        .footer-arrow { width: 10px; height: 14px; border-left: 2px solid #9ca3af; border-bottom: 2px solid #9ca3af; transform: rotate(45deg); opacity: 0.5; }
    </style>
</head>
<body>

    <div class="container">
        <div class="content">
            <!-- Encabezado -->
            <div class="header">
                <h1>CCOO Sanidad</h1>
                <p>Gestión de Vehículos de la Flota en Tiempo Real</p>
            </div>

            <!-- Formulario de Reserva -->
            <form id="formReserva">
                <div class="form-group">
                    <label>Seleccionar Vehículo</label>
                    <select id="vehiculo" required>
                        <option value="Dacia Sandero (Urbano - 5 Plazas)">Dacia Sandero (Urbano - 5 Plazas)</option>
                        <option value="Seat Alhambra (7 Plazas)">Seat Alhambra (7 Plazas)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Nombre del Solicitante / Sección</label>
                    <input type="text" id="solicitante" placeholder="Ej: Manuel Pérez - Hospital Clínico" required>
                </div>

                <div class="form-group">
                    <label>Fecha</label>
                    <input type="date" id="fecha" required>
                </div>

                <div class="form-group">
                    <label>Turno Horario</label>
                    <select id="turno" required>
                        <option value="Mañana (08:00 - 15:00)">Mañana (08:00 - 15:00)</option>
                        <option value="Tarde (15:00 - 22:00)">Tarde (15:00 - 22:00)</option>
                        <option value="Día Completo (08:00 - 22:00)">Día Completo (08:00 - 22:00)</option>
                    </select>
                </div>

                <button id="btnEnviar" type="submit" class="btn-submit">
                    Confirmar Reserva
                </button>
            </form>

            <!-- Sección Agenda de Reservas -->
            <div>
                <h2 class="agenda-title">Agenda de Reservas Activas</h2>
                <div id="listaReservas" class="reservas-list">
                    <p class="no-data">Cargando agenda desde Google Sheets...</p>
                </div>
            </div>
        </div>

        <div class="footer">
            <div class="footer-square"></div>
            <div class="footer-dot"></div>
            <div class="footer-arrow"></div>
        </div>
    </div>

    <script>
        const WEB_APP_URL = "https://google.com";

        let reservas = [];
        const form = document.getElementById('formReserva');
        const listaReservas = document.getElementById('listaReservas');
        const btnEnviar = document.getElementById('btnEnviar');

        // CORRECCIÓN CLAVE: Petición compatible con redirecciones de Google Apps Script sin bloqueo CORS
        async function cargarReservas() {
            try {
                const respuesta = await fetch(WEB_APP_URL, {
                    method: 'GET',
                    mode: 'cors',
                    redirect: 'follow'
                });
                reservas = await respuesta.json();
                actualizarAgenda();
            } catch (error) {
                console.error(error);
                listaReservas.innerHTML = '<p class="no-data" style="color: #ef4444;">Error de sincronización con la nube.</p>';
            }
        }

        function actualizarAgenda() {
            listaReservas.innerHTML = '';
            if (reservas.length === 0) {
                listaReservas.innerHTML = '<p class="no-data">No hay reservas activas en la nube.</p>';
                return;
            }

            reservas.forEach((reserva) => {
                let fechaFormateada = reserva.fecha;
                if(reserva.fecha.includes("T")) {
                    fechaFormateada = reserva.fecha.split("T")[0];
                }

                // Ajustar visualización del formato de fecha de texto plano de Google
                if(fechaFormateada.slice(0,4).includes("-") === false && fechaFormateada.length > 10){
                    const d = new Date(reserva.fecha);
                    if(!isNaN(d)) {
                        fechaFormateada = d.toISOString().split('T')[0];
                    }
                }

                let turnoLimpio = reserva.turno.split(' (')[0];

                const item = document.createElement('div');
                item.className = "reserva-card";
                item.innerHTML = `
                    <div class="reserva-info">
                        <h4>${reserva.vehiculo}</h4>
                        <p><b>Por:</b> ${reserva.solicitante}</p>
