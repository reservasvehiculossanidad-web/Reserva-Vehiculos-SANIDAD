<!-- REQUISITO: Asegúrate de que tus elementos HTML tengan estos IDs exactos o adáptalos -->
<select id="selectVehiculo" onchange="verificarDisponibilidad()">
  <option value="Toyota Corolla">Toyota Corolla</option>
  <option value="Ford Ranger">Ford Ranger</option>
  <option value="Tesla Model 3">Tesla Model 3</option>
</select>

<input type="date" id="inputFecha" onchange="verificarDisponibilidad()">

<select id="selectFranja" onchange="verificarDisponibilidad()">
  <option value="Mañana (08:00 - 12:00)">Mañana (08:00 - 12:00)</option>
  <option value="Mediodía (12:00 - 16:00)">Mediodía (12:00 - 16:00)</option>
  <option value="Tarde (16:00 - 20:00)">Tarde (16:00 - 20:00)</option>
</select>

<!-- Mensajes de estado -->
<p id="mensajeError" style="color: red; display: none;">⚠ Este vehículo ya está reservado en esa fecha y franja horaria.</p>
<p id="mensajeExito" style="color: green; display: none;">¡Reserva realizada con éxito!</p>

<button id="btnConfirmar" onclick="enviarReserva()">Confirmar Reserva</button>

<script>
// URL de despliegue de tu Apps Script integrada correctamente
const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbzWM5B9pevIWO1j8JlCfUvomxjfbNhY-6cCTNeynPL8ot_sz2BFHz3nkH4B4sB7uW8JTA/exec";

// Variable global para almacenar la base de datos temporal de reservas
let listaReservas = [];

// Al cargar la página, traemos las reservas actuales en formato JSON de la hoja de cálculo
window.onload = function() {
  fetch(URL_APPS_SCRIPT)
    .then(response => response.json())
    .then(data => {
      listaReservas = data;
    })
    .catch(err => console.error("Error al cargar reservas iniciales:", err));
};

// Comprueba en tiempo real si la selección ya está ocupada
function verificarDisponibilidad() {
  const vehiculo = document.getElementById("selectVehiculo").value;
  const fecha = document.getElementById("inputFecha").value;
  const franjaHoraria = document.getElementById("selectFranja").value;
  
  const mensajeError = document.getElementById("mensajeError");
  const btnConfirmar = document.getElementById("btnConfirmar");

  // Si no se ha elegido fecha, salimos de la función
  if (!fecha) return;

  // Buscamos si hay coincidencia exacta en el JSON local
  const yaReservado = listaReservas.some(reserva => 
    reserva.vehiculo === vehiculo && 
    reserva.fecha === fecha && 
    reserva.franjaHoraria === franjaHoraria
  );

  if (yaReservado) {
    mensajeError.style.display = "block"; // Muestra: ⚠ Este vehículo ya está reservado...
    btnConfirmar.disabled = true;         // Bloquea el botón
  } else {
    mensajeError.style.display = "none";
    btnConfirmar.disabled = false;        // Habilita el botón
  }
}

// Envía la nueva reserva mediante POST (JSON)
function enviarReserva() {
  const datosReserva = {
    vehiculo: document.getElementById("selectVehiculo").value,
    fecha: document.getElementById("inputFecha").value,
    franjaHoraria: document.getElementById("selectFranja").value
  };

  fetch(URL_APPS_SCRIPT, {
    method: "POST",
    mode: "no-cors", 
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(datosReserva)
  })
  .then(() => {
    // 1. Mostrar mensaje de éxito en pantalla
    document.getElementById("mensajeExito").style.display = "block";
    
    // 2. Añadir la reserva localmente para evitar recargar la página inmediatamente
    listaReservas.push(datosReserva);
    
    // 3. Volver a verificar para que bloquee la opción recién guardada inmediatamente
    verificarDisponibilidad();
  })
  .catch(error => {
    console.error("Error al guardar:", error);
    alert("Hubo un problema al procesar la reserva.");
  });
}
</script>
