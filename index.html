<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCOO Sanidad - Gestión de Vehículos</title>
    <script src="https://tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex justify-center items-start p-4">

    <div class="w-full max-w-md bg-white shadow-md rounded-lg overflow-hidden border border-gray-200 min-h-[90vh] flex flex-col justify-between">
        
        <div class="p-6">
            <!-- Encabezado -->
            <div class="text-center mb-6 border-b pb-4">
                <h1 class="text-2xl font-bold text-red-600 tracking-wide">CCOO Sanidad</h1>
                <p class="text-xs text-gray-500 mt-1 font-medium">Gestión de Vehículos de la Flota en Tiempo Real</p>
            </div>

            <!-- Formulario de Reserva -->
            <form id="formReserva" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Seleccionar Vehículo</label>
                    <select id="vehiculo" class="w-full border border-gray-300 rounded-lg p-2.5 bg-gray-50 text-gray-800 focus:ring-2 focus:ring-red-500 focus:outline-none" required>
                        <option value="Dacia Sandero (Urbano - 5 Plazas)">Dacia Sandero (Urbano - 5 Plazas)</option>
                        <option value="Seat Alhambra (7 Plazas)">Seat Alhambra (7 Plazas)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Nombre del Solicitante / Sección</label>
                    <input type="text" id="solicitante" placeholder="Ej: Manuel Pérez - Hospital Clínico" class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-red-500 focus:outline-none" required>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Fecha</label>
                    <input type="date" id="fecha" class="w-full border border-gray-300 rounded-lg p-2.5 text-gray-700 focus:ring-2 focus:ring-red-500 focus:outline-none" required>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Turno Horario</label>
                    <select id="turno" class="w-full border border-gray-300 rounded-lg p-2.5 bg-gray-50 text-gray-800 focus:ring-2 focus:ring-red-500 focus:outline-none" required>
                        <option value="Mañana (08:00 - 15:00)">Mañana (08:00 - 15:00)</option>
                        <option value="Tarde (15:00 - 22:00)">Tarde (15:00 - 22:00)</option>
                        <option value="Día Completo (08:00 - 22:00)">Día Completo (08:00 - 22:00)</option>
                    </select>
                </div>

                <button id="btnEnviar" type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-4 rounded-lg transition duration-200 tracking-wide mt-2 flex justify-center items-center">
                    Confirmar Reserva
                </button>
            </form>

            <!-- Sección Agenda de Reservas -->
            <div class="mt-8">
                <h2 class="text-lg font-bold text-gray-800 mb-3 border-b pb-1">Agenda de Reservas Activas</h2>
                <div id="listaReservas" class="space-y-3">
                    <p class="text-sm text-gray-400 italic text-center py-4">Cargando agenda desde Google Sheets...</p>
                </div>
            </div>
        </div>

        <div class="border-t bg-gray-50 p-3 flex justify-around text-gray-500 text-xl">
            <i class="fa-solid fa-square-minus opacity-40"></i>
            <i class="fa-regular fa-circle opacity-40"></i>
            <i class="fa-solid fa-chevron-left opacity-40"></i>
        </div>
    </div>

    <script>
        // URL vinculada de tu Google Apps Script
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwtFSpft1JTR5czvqFw43PDybegpR8KNneGNBJVLC8M3Q4_dzQYZ-zVF3Pgwl0Bha9r3A/exec";

        let reservas = [];
        const form = document.getElementById('formReserva');
        const listaReservas = document.getElementById('listaReservas');
        const btnEnviar = document.getElementById('btnEnviar');

        // Función para cargar los datos en JSON desde Google Sheets
        async function cargarReservas() {
            try {
                const respuesta = await fetch(WEB_APP_URL);
                reservas = await respuesta.json();
                actualizarAgenda();
            } catch (error) {
                listaReservas.innerHTML = '<p class="text-sm text-red-500 text-center py-4">Error al conectar con Google Sheets.</p>';
            }
        }

        // Dibuja las reservas obtenidas en pantalla
        function actualizarAgenda() {
            listaReservas.innerHTML = '';
            if (reservas.length === 0) {
                listaReservas.innerHTML = '<p class="text-sm text-gray-400 italic text-center py-4">No hay reservas activas en la nube.</p>';
                return;
            }

            reservas.forEach((reserva) => {
                let fechaFormateada = reserva.fecha;
                if(reserva.fecha.includes("T")) fechaFormateada = reserva.fecha.split("T")[0];

                const item = document.createElement('div');
                item.className = "flex items-center justify-between border border-gray-200 border-l-4 border-l-red-600 rounded-r-lg p-3 bg-white shadow-sm";
                item.innerHTML = `
                    <div class="flex-1 min-w-0">
                        <h4 class="font-bold text-gray-800 text-sm truncate">${reserva.vehiculo}</h4>
                        <p class="text-xs text-gray-500 mt-0.5"><b>Por:</b> ${reserva.solicitante}</p>
                        <p class="text-[11px] text-gray-400 mt-0.5">📅 ${fechaFormateada} | 🕒 ${reserva.turno.split(' (')[0]}</p>
                    </div>
                `;
                listaReservas.appendChild(item);
            });
        }

        // Envía el JSON mediante POST a Google Sheets pasando por el filtro de seguridad
        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            const vehiculo = document.getElementById('vehiculo').value;
            const solicitante = document.getElementById('solicitante').value.trim();
            const fecha = document.getElementById('fecha').value;
            const turno = document.getElementById('turno').value;

            // Validación local preventiva antes de subir
            const conflictoLocal = reservas.some(r => {
                let rFecha = r.fecha.includes("T") ? r.fecha.split("T")[0] : r.fecha;
                if (r.vehiculo === vehiculo && rFecha === fecha) {
                    if (r.turno.includes("Día Completo") || turno.includes("Día Completo") || r.turno === turno) {
                        return true;
                    }
                }
                return false;
            });

            if (conflictoLocal) {
                alert(`⚠️ Conflicto: El vehículo "${vehiculo}" ya está asignado para este turno.`);
                return;
            }

            btnEnviar.disabled = true;
            btnEnviar.innerText = "Guardando en Sheets...";

            const nuevaReserva = { vehiculo, solicitante, fecha, turno };

            try {
                const respuesta = await fetch(WEB_APP_URL, {
                    redirect: "follow", 
                    method: "POST",
                    body: JSON.stringify(nuevaReserva),
                    headers: { "Content-Type": "text/plain" } 
                });
                
                const resultado = await respuesta.json();
                
                if(resultado.status === "success") {
                    form.reset();
                    await cargarReservas(); 
                } else {
                    alert("Error en el servidor de Google Sheets: " + resultado.message);
                }
            } catch (error) {
                alert("Error de conexión al guardar los datos.");
            } finally {
                btnEnviar.disabled = false;
                btnEnviar.innerText = "Confirmar Reserva";
            }
        });

        // Inicializar la carga al abrir la aplicación
        cargarReservas();
    </script>
</body>
</html>
