<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>CCOO Sanidad - Reserva de Vehículos</title>
    <style>
        /* Forzamos que la página ocupe todo el espacio del móvil sin barras rebeldes */
        html, body { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            background-color: #f4f6f8; 
            overflow: hidden; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }

        /* Envoltorio elástico estilo App de smartphone */
        .app-phone-wrapper {
            width: 100%;
            height: 100%;
            max-width: 450px; /* Ancho idóneo de una app móvil en cualquier pantalla */
            margin: 0 auto;
            box-sizing: border-box;
            background: #ffffff;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
        }

        /* Marco de comunicación directo que inyecta tu app de Google */
        iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
            display: block;
            /* Suavizado de scroll táctil obligatorio para móviles */
            -webkit-overflow-scrolling: touch; 
        }

        /* Ocultar elementos molestos y ajustar visualización en pantallas grandes */
        @media (min-width: 451px) {
            body {
                background-color: #e2e8f0;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 20px;
            }
            .app-phone-wrapper {
                height: 85vh;
                border-radius: 16px;
                overflow: hidden;
                border: 4px solid #1a202c; /* Efecto marco de teléfono en ordenadores */
            }
        }
    </style>
</head>
<body>

    <!-- Este contenedor obliga a la app a verse ordenada, grande y nítida en teléfonos -->
    <div class="app-phone-wrapper">
        <!-- ⚠️ REEMPLAZA EL SRC CON TU URL DE GOOGLE APPS SCRIPT /EXEC -->
        <iframe src="https://google.com"></iframe>
    </div>

</body>
</html>
