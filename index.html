<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Reservas de Vehículos</title>
    <!-- FullCalendar CSS -->
    <link href="https://jsdelivr.net" rel="stylesheet">
    <!-- Tailwind CSS para diseño rápido y limpio -->
    <script src="https://jsdelivr.net"></script>
    <style>
        /* Forzar que los eventos del calendario sean rojos tal como solicitaste */
        .fc-event {
            background-color: #ef4444 !important; /* Rojo intenso */
            border-color: #dc2626 !important;
            color: white !important;
            font-weight: bold;
            padding: 2px 4px;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans">

    <div class="max-w-6xl mx-auto p-4 sm:p-6 lg:p-8">
        <!-- Cabecera -->
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-bold text-gray-800">Reserva de Vehículos</h1>
            <p class="text-gray-600 mt-2">Conectado en tiempo real con Google Sheets</p>
            <div class="inline-block mt-3 px-4 py-1.5 bg-green-100 text-green-800 text-xs font-semibold rounded-full uppercase tracking-wider">
                ● Conexión Activa
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Formulario de Reserva -->
            <div class="bg-white p-6 rounded-xl shadow-md h-fit">
                <h2 class="text-xl font-semibold text-gray-700 mb-4">Nueva Reserva</h2>
                
                <form id="formReserva" class="space-y-4">
                    <!-- Selección de Vehículo -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Seleccionar Vehículo</label>
                        <select id="vehiculo" class="w-full p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:outline-none" required>
                            <option value="">-- Elige un vehículo --</option>
                            <option value="Toyota Corolla">Toyota Corolla</option>
                            <option value="Hyundai Tucson">Hyundai Tucson</option>
                            <option value="Tesla Model 3">Tesla Model 3</option>
                            <option value="Furgoneta Ford">Furgoneta Ford</option>
                        </select>
                    </div>

                    <!-- Selección de Fecha -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Fecha de Reserva</label>
                        <input type="date" id="fecha" class="w-full p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:outline-none" required>
                    </div>

                    <!-- Franja Horaria -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Franja Horaria</label>
                        <select id="franja" class="w-full p-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:outline-none" required>
                            <option value="">-- Selecciona el horario --</option>
                            <option value="Mañana (08:00 - 14:00)">Mañana (08:00 - 14:00)</option>
                            <option value="Tarde (14:00 - 20:00)">Tarde (14:00 - 20:00)</option>
                            <option value="Día Completo (08:00 - 20:00)">Día Completo (08:00 - 20:00)</option>
                        </select>
                    </div>

                    <!-- Botón de Envío -->
                    <button type="submit" id="btnReservar" class="w-full bg-red-600 hover:bg-red-700 text-white font-medium py-2.5 px-4 rounded-lg transition duration-200 shadow-sm cursor-pointer">
                        Confirmar Reserva
                    </button>
                </form>

                <!-- Estado de la Red / Avisos -->
                <div id="statusMessage" class="mt-4 text-sm text-center hidden"></div>
            </div>

            <!-- Calendario -->
            <div class="lg:col-span-2 bg-white p-6 rounded-xl shadow-md">
                <div id="calendar"></div>
            </div>
        </div>
    </div>

    <!-- FullCalendar JavaScript -->
    <script src="https://jsdelivr.net"></script>
    
    <script>
        // Tu URL de Google Apps Script vinculada de forma fija
        const SCRIPT_URL = "https://google.com";
        
        let calendar;
        let reservasLocales = [];

        // Inicializar el calendario cuando la página cargue
        document.addEventListener('DOMContentLoaded', function() {
            const calendarEl = document.getElementById('calendar');
            
            calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                locale: 'es',
                firstDay: 1, // Lunes como primer día
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,timeGridWeek'
                },
                buttonText: {
                    today: 'Hoy',
                    month: 'Mes',
                    week: 'Semana'
                },
                events: []
            });
            
            calendar.render();
            
            // Cargar datos iniciales desde Google Sheets
            cargarReservas();
        });

        // Función para leer reservas desde Google Sheets (GET)
        async function cargarReservas() {
            mostrarEstado("Cargando reservas desde la nube...", "info");
            try {
                const response = await fetch(SCRIPT_URL);
                if (!response.ok) throw new Error("Error en la respuesta de red.");
                
                const datos = await response.json();
                reservasLocales = datos; // Guardar copia en memoria para validaciones
                
                // Mapear los datos de Sheets al formato que exige FullCalendar
                const eventosCalendario = datos.map(reserva => {
                    return {
                        title: `${reserva.vehiculo} (${reserva.franja})`,
                        start: reserva.fecha,
                        allDay: true
                    };
                });
                
                // Limpiar y refrescar eventos en el calendario
                calendar.removeAllEvents();
                calendar.addEventSource(eventosCalendario);
                mostrarEstado("Calendario actualizado.", "success");
                setTimeout(() => ocultarEstado(), 3000);

            } catch (error) {
                console.error("Error al cargar:", error);
                mostrarEstado("No se pudieron sincronizar las reservas. Usando caché offline.", "error");
            }
        }

        // Manejador del Formulario (Validación + Envío POST)
        document.getElementById('formReserva').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const vehiculo = document.getElementById('vehiculo').value;
            const fecha = document.getElementById('fecha').value;
            const franja = document.getElementById('franja').value;
            const btn = document.getElementById('btnReservar');

            // --- VALIDACIÓN ESTRICTA EN TIEMPO REAL ---
            // Comprobamos si ya existe el mismo vehículo, el mismo día en la misma franja
            const existeDuplicado = reservasLocales.some(reserva => {
                return reserva.vehiculo === vehiculo && 
                       reserva.fecha === fecha && 
                       reserva.franja === franja;
            });

            if (existeDuplicado) {
                alert(`⚠️ ¡Error de conflicto!\nEl vehículo "${vehiculo}" ya está reservado para el día ${fecha} en la franja de la "${franja}".\nPor favor, elige otra combinación.`);
                return;
            }

            // Deshabilitar botón durante el proceso de guardado
            btn.disabled = true;
            btn.innerText = "Guardando en Sheets...";
            mostrarEstado("Enviando reserva a Google Sheets...", "info");

            try {
                // Enviar datos por POST usando URLSearchParams para evitar problemas de CORS en Apps Script
                const formData = new URLSearchParams();
                formData.append('vehiculo', vehiculo);
                formData.append('fecha', fecha);
                formData.append('franja', franja);

                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    }
                });

                const resultado = await response.json();

                if (resultado.status === 'success') {
                    // Limpiar formulario si el registro fue exitoso
                    document.getElementById('formReserva').reset();
                    alert("🎉 ¡Reserva confirmada con éxito y registrada en Google Sheets!");
                    // Recargar datos para pintar el nuevo evento en rojo
                    await cargarReservas();
                } else {
                    alert("Error del servidor: " + resultado.message);
                    mostrarEstado("Error: " + resultado.message, "error");
                }

            } catch (error) {
                console.error("Error al enviar:", error);
                alert("Hubo un error de conexión con Google Sheets. Inténtalo de nuevo.");
