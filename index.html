<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva Vehículos - Sanidad CCOO</title>
    <!-- FullCalendar CSS y JS -->
    <link href="https://jsdelivr.net" rel="stylesheet">
    <script src="https://jsdelivr.net"></script>
    
    <style>
        :root {
            --primary-color: #b32424; /* Rojo CCOO */
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .header {
            text-align: center;
            border-bottom: 3px solid var(--primary-color);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        .header h1 {
            color: var(--primary-color);
            margin: 0 0 5px 0;
            font-size: 28px;
        }

        .header p {
            margin: 0;
            color: #666;
            font-style: italic;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .form-control {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 15px;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 5px rgba(179, 36, 36, 0.3);
        }

        .btn-submit {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: #911d1d;
        }

        .status-message {
            text-align: center;
            margin: 15px 0;
            font-weight: bold;
            display: none;
        }

        .section-title {
            margin-top: 40px;
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 8px;
            color: var(--primary-color);
            font-size: 22px;
        }

        /* Estilos personalizados para FullCalendar */
        #calendar {
            margin-top: 20px;
            background: #fff;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }
        .fc-header-toolbar {
            flex-wrap: wrap;
            gap: 10px;
        }
        .fc-event {
            cursor: pointer;
            padding: 2px 4px;
            font-size: 13px !important;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>CCOO Sanidad</h1>
        <p>Gestión de Vehículos de la Flota en Tiempo Real</p>
    </div>

    <!-- Formulario de Reserva -->
    <form id="reservaForm" onsubmit="confirmarReserva(event)">
        <div class="form-group">
            <label for="vehiculo">Seleccionar Vehículo</label>
            <select id="vehiculo" class="form-control" required>
                <option value="Dacia Sandero (Urbano - 5 Plazas)">Dacia Sandero (Urbano - 5 Plazas)</option>
                <option value="Seat Alhambra (Largo/Material - 7 Plazas)">Seat Alhambra (Largo/Material - 7 Plazas)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="usuario">Nombre del Solicitante / Sección</label>
            <input type="text" id="usuario" class="form-control" placeholder="Ej: Manuel Pérez - Hospital Clínico" required>
        </div>

        <div class="form-group">
            <label for="fecha">Fecha</label>
            <input type="date" id="fecha" class="form-control" required>
        </div>

        <div class="form-group">
            <label for="turno">Turno Horario</label>
            <select id="turno" class="form-control" required>
                <option value="Mañana (08:00 - 15:00)">Mañana (08:00 - 15:00)</option>
                <option value="Tarde (15:00 - 22:00)">Tarde (15:00 - 22:00)</option>
                <option value="Día Completo">Día Completo</option>
            </select>
        </div>

        <button type="submit" class="btn-submit">Confirmar Reserva</button>
    </form>

    <div id="status" class="status-message">Sincronizando con la nube...</div>

    <!-- Sección del Calendario -->
    <h2 class="section-title">Agenda de Reservas Activas</h2>
    <div id="calendar"></div>
</div>

<script>
    // URL DE TU DESPLIEGUE DE GOOGLE APPS SCRIPT
    const WEB_APP_URL = "SUSTITUYE_ESTO_POR_TU_URL_DE_APPS_SCRIPT"; 
    
    let calendar;

    document.addEventListener('DOMContentLoaded', function() {
        const calendarEl = document.getElementById('calendar');
        
        calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'dayGridMonth',
            locale: 'es',
            firstDay: 1, 
            headerToolbar: {
                left: 'prev,next today',
                center: 'title',
                right: 'dayGridMonth,timeGridWeek'
            },
            buttonText: {
                today: 'Hoy',
                month: 'Mes',
                week: 'Semana'
            },
            eventClick: function(info) {
                // Al hacer clic en un evento del calendario, da la opción de eliminarlo
                if (confirm(`¿Deseas cancelar la reserva de:\n${info.event.title}?`)) {
                    eliminarReserva(info.event.id);
                }
            }
        });
        
        calendar.render();
        cargarReservas();
    });

    function mostrarStatus(texto, color = "#333") {
        const statusEl = document.getElementById("status");
        statusEl.innerText = texto;
        statusEl.style.color = color;
        statusEl.style.display = "block";
    }

    function ocultarStatus() {
        document.getElementById("status").style.display = "none";
    }

    // Obtener reservas desde la hoja de cálculo
    function cargarReservas() {
        mostrarStatus("Cargando agenda de reservas...", "#333");
        
        fetch(WEB_APP_URL)
            .then(response => response.json())
            .then(data => {
                calendar.removeAllEvents();
                
                data.forEach(reserva => {
                    // Limpiar el nombre del vehículo para que el título no sea extremadamente largo
                    const vehiculoCorto = reserva.vehiculo.split('(')[0].trim();
                    
                    calendar.addEvent({
                        id: reserva.id,
                        title: `${vehiculoCorto} - ${reserva.usuario} (${reserva.turno.split(' ')[0]})`,
                        start: reserva.fecha, 
                        allDay: true,
                        backgroundColor: var(--primary-color),
                        borderColor: var(--primary-color),
                        extendedProps: {
                            turno: reserva.turno,
                            vehiculoCompleto: reserva.vehiculo
                        }
                    });
                });
                ocultarStatus();
            })
            .catch(err => {
                console.error(err);
                mostrarStatus("Error al cargar las reservas activos.", "red");
            });
    }

    // Enviar formulario controlando la validación del servidor
    function confirmarReserva(event) {
        event.preventDefault();
        
        const vehiculo = document.getElementById("vehiculo").value;
        const usuario = document.getElementById("usuario").value;
        const fecha = document.getElementById("fecha").value;
        const turno = document.getElementById("turno").value;

        mostrarStatus("Comprobando disponibilidad y guardando...", "orange");

        const nuevaReserva = {
            action: "add",
            id: "ID-" + Date.now(), // Generación de identificador único basado en tiempo
            vehiculo: vehiculo,
            usuario: usuario,
            fecha: fecha,
            turno: turno
        };

        fetch(WEB_APP_URL, {
            method: "POST",
            body: JSON.stringify(nuevaReserva)
        })
        .then(response => response.json())
        .then(res => {
            if (res.status === "success") {
                alert("¡Reserva confirmada con éxito!");
                document.getElementById("reservaForm").reset();
                cargarReservas();
            } else if (res.status === "error") {
                // Captura el bloqueo enviado desde el Apps Script
                alert("No se puede realizar la reserva:\n" + res.message);
                ocultarStatus();
            }
        })
        .catch(err => {
            console.error(err);
            mostrarStatus("Error de red o comunicación con el servidor.", "red");
        });
    }

    // Cancelar reserva desde el calendario
    function eliminarReserva(id) {
        mostrarStatus("Cancelando reserva...", "orange");
        
        fetch(WEB_APP_URL, {
            method: "POST",
