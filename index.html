<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCOO Sanidad - Gestión de Vehículos</title>
    <!-- FullCalendar CSS -->
    <link href="https://jsdelivr.net" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://jsdelivr.net"></script>
    <style>
        /* Estilos personalizados para clonar la interfaz de la foto */
        .brand-red { background-color: #c92128; }
        .brand-red-text { color: #c92128; }
        .border-brand-red { border-left: 6px solid #c92128; }
        
        /* Forzar que los eventos del calendario sean rojos tal como pediste */
        .fc-event {
            background-color: #c92128 !important; 
            border-color: #b01c22 !important;
            color: white !important;
            font-weight: 500;
            padding: 3px 5px;
            font-size: 0.85em;
            border-radius: 4px;
        }
        .fc-header-toolbar {
            margin-bottom: 1rem !important;
            font-size: 0.9rem;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen font-sans antialiased text-gray-800">

    <div class="max-w-md mx-auto bg-white min-h-screen shadow-lg pb-12">
        
        <!-- ENCABEZADO EXACTO DE LA FOTO -->
        <header class="text-center pt-6 pb-4 border-b border-gray-100 px-4">
            <h1 class="text-2xl font-bold brand-red-text tracking-wide">CCOO Sanidad</h1>
            <p class="text-gray-500 text-sm mt-1 font-medium">Gestión de Vehículos de la Flota en Tiempo Real</p>
            <div class="w-24 h-0.5 brand-day brand-red mx-auto mt-3"></div>
        </header>

        <!-- FORMULARIO PRINCIPAL -->
        <main class="p-5 space-y-5">
            <form id="formReserva" class="space-y-4">
                
                <!-- Seleccionar Vehículo -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Seleccionar Vehículo</label>
                    <select id="vehiculo" class="w-full p-3 bg-gray-100 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-red-500 focus:outline-none transition-all text-gray-700" required>
                        <option value="Dacia Sandero (Urbano - 5 Plazas)">Dacia Sandero (Urbano - 5 Plazas)</option>
                        <option value="Seat Alhambra (7 Plazas)">Seat Alhambra (7 Plazas)</option>
                    </select>
                </div>

                <!-- Nombre del Solicitante / Sección -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Nombre del Solicitante / Sección</label>
                    <input type="text" id="solicitante" placeholder="Ej: Manuel Pérez - Hospital Clínico" class="w-full p-3 bg-gray-100 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-red-500 focus:outline-none transition-all text-gray-700" required>
                </div>

                <!-- Fecha -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Fecha</label>
                    <input type="date" id="fecha" class="w-full p-3 bg-gray-100 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-red-500 focus:outline-none transition-all text-gray-700" required>
                </div>

                <!-- Turno Horario -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Turno Horario</label>
                    <select id="franja" class="w-full p-3 bg-gray-100 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-red-500 focus:outline-none transition-all text-gray-700" required>
                        <option value="Mañana (08:00 - 15:00)">Mañana (08:00 - 15:00)</option>
                        <option value="Tarde (15:00 - 22:00)">Tarde (15:00 - 22:00)</option>
                        <option value="Día Completo">Día Completo</option>
                    </select>
                </div>

                <!-- Botón de Confirmar -->
                <button type="submit" id="btnReservar" class="w-full brand-red text-white font-bold py-3.5 px-4 rounded-xl transition duration-200 active:scale-[0.99] shadow-md cursor-pointer text-base">
                    Confirmar Reserva
                </button>
            </form>

            <div id="statusMessage" class="text-xs text-center font-medium text-blue-600 hidden"></div>

            <!-- SECCIÓN DE CALENDARIO VISUAL ADICIONADA -->
            <div class="pt-4 border-t border-gray-100">
                <h2 class="text-lg font-bold text-gray-800 mb-3">Calendario Mensual</h2>
                <div class="bg-white border border-gray-100 p-2 rounded-xl shadow-xs">
                    <div id="calendar"></div>
                </div>
            </div>

            <!-- AGENDA DE RESERVAS ACTIVAS -->
            <div class="pt-4 border-t border-gray-100">
                <h2 class="text-lg font-bold text-gray-800 mb-3">Agenda de Reservas Activas</h2>
                <div id="listaReservas" class="space-y-3">
                    <!-- Las reservas se renderizan aquí dinámicamente -->
                    <p class="text-sm text-gray-400 text-center py-2">Consultando reservas activas...</p>
                </div>
            </div>

        </main>
    </div>

    <!-- FullCalendar JavaScript -->
    <script src="https://jsdelivr.net"></script>
    
    <script>
        // URL de tu Google Apps Script integrada
        const SCRIPT_URL = "https://google.com";
        
        let calendar;
        let reservasLocales = [];

        document.addEventListener('DOMContentLoaded', function() {
            const calendarEl = document.getElementById('calendar');
            
            calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                locale: 'es',
                firstDay: 1,
                height: 'auto',
                headerToolbar: {
                    left: 'prev,next',
                    center: 'title',
                    right: 'today'
                },
                buttonText: { today: 'Hoy' },
                events: []
            });
            
            calendar.render();
            cargarReservas();
        });

        // Cargar datos (GET)
        async function cargarReservas() {
            mostrarEstado("Sincronizando con Google Sheets...");
            try {
                const response = await fetch(SCRIPT_URL);
                if (!response.ok) throw new Error("Error de red");
                
                const datos = await response.json();
                reservasLocales = datos;
                
                // 1. Actualizar Calendario Visual en Rojo
                const eventos = datos.map(res => ({
                    title: `${res.vehiculo.split(' ')[0]} - ${res.franja.split(' ')[0]}`,
                    start: res.fecha,
                    allDay: true
                }));
                calendar.removeAllEvents();
                calendar.addEventSource(eventos);
                
                // 2. Actualizar Lista Visual de abajo (Estilo de la foto)
                renderizarLista();
                ocultarEstado();

            } catch (error) {
                console.error(error);
                mostrarEstado("Error al conectar. Verifica los permisos en Google Sheets.");
            }
        }

        // Renderizar la lista inferior con el botón Cancelar tal como en la foto
        function renderizarLista() {
            const listaContainer = document.getElementById('listaReservas');
            if (reservasLocales.length === 0) {
                listaContainer.innerHTML = `<p class="text-sm text-gray-400 text-center py-2">No hay reservas registradas.</p>`;
                return;
            }

            listaContainer.innerHTML = "";
            // Mostramos las últimas reservas ordenadas por fecha reciente
            reservasLocales.forEach((res, index) => {
                const item = document.createElement('div');
                item.className = "flex justify-between items-center bg-white p-3 rounded-xl border border-gray-100 shadow-xs border-brand-red";
                item.innerHTML = `
                    <div>
                        <h4 class="font-bold text-gray-800 text-sm">${res.vehiculo}</h4>
                        <p class="text-xs text-gray-500 font-medium mt-0.5">Por: ${res.solicitante || 'No especificado'}</p>
                        <p class="text-[11px] text-gray-400 mt-0.5">${res.fecha} | ${res.franja}</p>
                    </div>
                    <button onclick="solicitarCancelacion(${index})" class="bg-red-50 hover:bg-red-100 text-red-600 text-xs font-bold px-3 py-1.5 rounded-lg transition-all cursor-pointer">
                        Cancelar
                    </button>
                `;
                listaContainer.appendChild(item);
            });
        }

        // Formulario (Validación estricta de duplicados + Envío POST)
        document.getElementById('formReserva').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const vehiculo = document.getElementById('vehiculo').value;
            const solicitante = document.getElementById('solicitante').value;
            const fecha = document.getElementById('fecha').value;
            const franja = document.getElementById('franja').value;
            const btn = document.getElementById('btnReservar');

            // --- VALIDACIÓN SOLICITADA ---
            // Verifica que no coincida Vehículo, Día y Franja
